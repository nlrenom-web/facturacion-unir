<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>UNIR S.A. - Sistema de Verificación de Facturas</title>
    <base href="/facturacion-unir/" />

    <!-- Fuentes e Iconografía -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/unibot.css" rel="stylesheet" />
    <link href="SistemaServiciosPWA.styles.css" rel="stylesheet" />

    <!-- Librería Nativa para Descarga Directa de PDF sin Impresora -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #F4F7F9; font-family: 'Inter', sans-serif;">
            <div style="width: 50px; height: 50px; border: 4px solid #CBD5E1; border-top-color: #004B87; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            <p style="margin-top: 1rem; color: #004B87; font-weight: 700; font-size: 0.95rem;">Cargando Sistema UNIR S.A....</p>
        </div>
        <style>
            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }

                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
    </div>

    <div id="blazor-error-ui" style="display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #DC2626; color: white; padding: 12px; text-align: center; z-index: 4000;">
        Ha ocurrido un error no esperado. <a href="" class="reload" style="color: white; font-weight: bold;">Recargar</a>
    </div>

    <script src="/js/pwa-install.js"></script>
    <script src="/_framework/blazor.webassembly.js"></script>

    <script>
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('/service-worker.js');
                }

                window.evaluarEstadoConexion = () => navigator.onLine;

                // Función que convierte el elemento HTML de la factura en un archivo .pdf descargable
                window.descargarFacturaComoPdf = function (elementId, nombreArchivo) {
                    const elemento = document.getElementById(elementId);
                    if (!elemento) return;

                    const opciones = {
                        margin:       10,
                        filename:     nombreArchivo,
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { scale: 2 },
                        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    };

                    html2pdf().set(opciones).from(elemento).save();
                };
    </script>
</body>

</html>
